<!-- Navy, between the cream portfolio and the cream process section, so the
     page keeps alternating: what we have made, what we make it on, then how a
     project runs. -->
<section
  id="capabilities"
  class="scroll-mt-[var(--header-h)] bg-navy-900 px-6 py-16 lg:px-10 lg:py-24"
  aria-labelledby="capabilities-heading"
>
  <div class="mx-auto w-full max-w-5xl">
    <div appReveal>
      <p class="text-xs font-bold uppercase tracking-widest text-royal-400">{{ i18n.t('capabilities.eyebrow') }}</p>
      <h2
        id="capabilities-heading"
        class="mt-3 font-display text-3xl font-extrabold leading-tight text-white sm:text-4xl"
      >
        {{ i18n.t('capabilities.heading') }}
      </h2>
      <p class="mt-4 max-w-2xl text-base leading-relaxed text-slate-400">{{ i18n.t('capabilities.intro') }}</p>
    </div>

    <!-- On a phone, one row to swipe through rather than six stacked cards:
         no boxes, each item centred under its icon, and narrower than the
         screen so the next one peeks in and says the row scrolls. The negative
         margin lets it run to the screen edges, and the 21vw padding either
         side - half of what a 58vw item leaves of the screen - lets the first
         and last items reach the centre like the rest. From sm up it becomes a grid of
         cards - two across, three from lg - with the icon beside the text. -->
    <ul
      #row
      class="no-scrollbar -mx-6 mt-8 flex snap-x snap-mandatory gap-2 overflow-x-auto px-[21vw] pb-2 sm:mx-0 sm:mt-10 sm:grid sm:grid-cols-2 sm:gap-4 sm:overflow-visible sm:px-0 sm:pb-0 lg:mt-12 lg:grid-cols-3 lg:gap-5"
    >
      @for (capability of capabilities; track capability.key; let i = $index) {
        <li
          [appReveal]="80 + i * 60"
          class="flex w-[58vw] shrink-0 snap-center flex-col items-center gap-4 px-2 text-center sm:w-auto sm:flex-row sm:items-start sm:gap-5 sm:rounded-2xl sm:bg-white/5 sm:p-6 sm:text-start sm:ring-1 sm:ring-white/10"
        >
          <div class="shrink-0">
            <!-- Generated by tools/capability-icons in the process icons' style.
                 The alt names the craft so the image can be found in image
                 search, not only the text. -->
            <img
              [src]="'/capabilities/' + capability.index + '.png'"
              [alt]="i18n.t(capability.key + '.title')"
              width="256"
              height="256"
              loading="lazy"
              decoding="async"
              draggable="false"
              class="h-20 w-20 object-contain sm:h-16 sm:w-16"
            />
          </div>
          <div>
            <h3 class="font-display text-base font-bold leading-snug text-white sm:text-lg">{{ i18n.t(capability.key + '.title') }}</h3>
            <p class="mt-1.5 text-sm leading-relaxed text-slate-400">{{ i18n.t(capability.key + '.description') }}</p>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
