<section
  id="process"
  class="flex scroll-mt-[var(--header-h)] flex-col justify-center bg-navy-900 px-6 py-16 lg:px-10 lg:py-24"
  aria-labelledby="process-heading"
>
  <div class="mx-auto w-full max-w-7xl">
    <div class="flex flex-col justify-between gap-6 lg:flex-row lg:items-end">
      <div appReveal>
        <p class="text-xs font-bold uppercase tracking-widest text-royal-400">{{ i18n.t('process.eyebrow') }}</p>
        <h2
          id="process-heading"
          class="mt-3 font-display text-3xl font-extrabold leading-tight text-white sm:text-4xl"
        >
          {{ i18n.t('process.heading') }}
        </h2>
        <p class="mt-4 font-display text-lg font-bold text-royal-400">{{ i18n.t('process.lead') }}</p>
      </div>
      <div [appReveal]="120" class="max-w-sm space-y-3 text-sm leading-relaxed text-slate-400">
        <p>{{ i18n.t('process.intro') }}</p>
        <p>{{ i18n.t('process.intro2') }}</p>
      </div>
    </div>

    <!-- A phone gets a ruled list, not cards. Two columns left about 80px for
         the title and clipped words like "Understand"; six full-width cards fix
         that but turn a short sequence into a long scroll of padded boxes. A
         process is a list, so on the narrowest screens it is drawn as one, and
         the cards come back from tablet width up. -->
    <div
      class="mt-10 grid grid-cols-1 divide-y divide-white/10 border-y border-white/10 sm:mt-14 sm:grid-cols-2 sm:gap-6 sm:divide-y-0 sm:border-0 lg:grid-cols-3"
    >
      @for (step of steps; track step.index; let i = $index) {
        <!-- The number keeps its own column, so a long title wraps beside it
             rather than against it. Baseline alignment sits the digits with the
             words instead of floating above them. -->
        <div
          [appReveal]="180 + i * 110"
          class="flex items-baseline gap-4 py-5 sm:rounded-2xl sm:border sm:border-white/10 sm:p-7"
        >
          <!-- Forced LTR: "01" is a number, and bidi otherwise reorders it
               against the Arabic title beside it. -->
          <span dir="ltr" class="shrink-0 font-display text-2xl font-extrabold text-royal-400">
            {{ step.index }}
          </span>
          <div class="min-w-0">
            <h3 class="font-display text-lg font-bold text-white">{{ i18n.t(step.titleKey) }}</h3>
            <p class="mt-2 text-sm leading-relaxed text-slate-400">{{ i18n.t(step.descriptionKey) }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
