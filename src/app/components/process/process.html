<section
  id="process"
  class="flex scroll-mt-[var(--header-h)] flex-col justify-center bg-cream-50 px-6 py-16 lg:px-10 lg:py-24"
  aria-labelledby="process-heading"
>
  <div class="mx-auto w-full max-w-5xl">
    <div appReveal>
      <p class="text-xs font-bold uppercase tracking-widest text-royal-600">{{ i18n.t('process.eyebrow') }}</p>
      <h2
        id="process-heading"
        class="mt-3 font-display text-3xl font-extrabold leading-tight text-navy-900 sm:text-4xl"
      >
        {{ i18n.t('process.heading') }}
      </h2>
      <p class="mt-4 font-display text-lg font-bold text-royal-600">{{ i18n.t('process.lead') }}</p>
    </div>

    <!-- The track. Six stops on one line, so the sequence is visible as a
         sequence; only the chosen step speaks, which is what keeps five
         paragraphs off the page. Always LTR: it is a timeline, not a sentence,
         and under RTL the fill is anchored to the right instead. -->
    <div [appReveal]="140" class="mt-12 lg:mt-14">
      <div class="process-track relative" dir="ltr">
        <!-- Behind the stops, which paint over it: the rail is only meant to
             join them, not to run through them. That needs the stop's own
             background to be opaque, which is why the reached state uses the
             flat blend of royal-600/20 over navy-900 rather than the
             translucent tint it looks like. -->
        <!-- 2px on cream, centred on the stops: one pixel above their middle. -->
        <div class="process-rail absolute top-[21px] -z-10 sm:top-[31px]" aria-hidden="true">
          <div class="h-0.5 w-full rounded-full bg-navy-900/20"></div>
          <!-- Always anchored left, never flipped for Arabic: the track itself
               is forced LTR above because it is a timeline, not a sentence, so
               step 01 is on the left in both languages and the fill has to grow
               the same way the stops are ordered. -->
          <div
            #railFill
            class="process-fill absolute left-0 top-0 h-0.5 rounded-full bg-royal-600"
            [style.width.%]="fill()"
            [style.transitionDuration.ms]="fillMs()"
            [style.transitionTimingFunction]="fillEase()"
          ></div>
        </div>

        <div class="relative flex justify-between" role="tablist" [attr.aria-label]="i18n.t('process.steps')">
          @for (step of steps; track step.index; let i = $index) {
            <button
              type="button"
              role="tab"
              [id]="'process-tab-' + i"
              [attr.aria-selected]="active() === i"
              [attr.aria-controls]="'process-panel'"
              [attr.tabindex]="active() === i ? 0 : -1"
              [attr.aria-label]="i18n.t(step.titleKey)"
              (click)="select(i)"
              class="process-stop group flex cursor-pointer flex-col items-center gap-2 rounded-lg px-1 outline-none focus-visible:ring-2 focus-visible:ring-royal-600"
            >
              <span
                class="flex h-11 w-11 items-center justify-center rounded-full border-2 transition duration-300 sm:h-16 sm:w-16"
                [class]="reached(i)
                  ? 'border-royal-600 bg-[#182563]'
                  : 'border-navy-900 bg-navy-900 group-hover:border-royal-600'"
              >
                <img
                  [src]="step.icon"
                  alt=""
                  aria-hidden="true"
                  width="40"
                  height="40"
                  loading="lazy"
                  decoding="async"
                  class="h-9 w-9 transition duration-300 sm:h-[3.25rem] sm:w-[3.25rem]"
                  [class.opacity-60]="!reached(i)"
                />
              </span>
              <span
                class="font-display text-xs font-extrabold tracking-widest transition-colors"
                [class]="reached(i) ? 'text-royal-600' : 'text-slate-500'"
              >
                {{ step.index }}
              </span>
            </button>
          }
        </div>
      </div>

      <!-- One panel, not six. The step that is chosen is the only one talking. -->
      <div
        id="process-panel"
        role="tabpanel"
        [attr.aria-labelledby]="'process-tab-' + active()"
        class="mt-10 min-h-[8rem] text-center sm:min-h-[7rem]"
      >
        @if (activeStep(); as step) {
          <!-- Keyed on the index so Angular rebuilds the panel on every change,
               which is what lets the entry animation run again each time. -->
          @if (active() >= 0) {
            <div class="process-panel" [attr.key]="step.index">
              <h3 class="font-display text-xl font-extrabold text-navy-900 sm:text-2xl">
                {{ i18n.t(step.titleKey) }}
              </h3>
              <p class="mx-auto mt-3 max-w-xl text-sm leading-relaxed text-slate-600 sm:text-base">
                {{ i18n.t(step.descriptionKey) }}
              </p>
            </div>
          }
        }
      </div>
    </div>
  </div>
</section>
