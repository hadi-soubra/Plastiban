<footer class="border-t border-white/10 bg-navy-950 px-6 py-8 lg:px-10">
  <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-6 sm:flex-row">
    <!-- Each of the three groups claims an equal share so the icons land on the
         true centre of the footer rather than the midpoint of the leftover gap. -->
    <div class="flex items-center gap-3 sm:flex-1">
      <img
        src="logo.png"
        [alt]="i18n.t('brand.name')"
        width="36"
        height="36"
        class="h-9 w-9 shrink-0 object-contain"
      />
      <span class="font-display text-sm font-extrabold tracking-tight text-white">{{ i18n.t('brand.name') }}</span>
    </div>

    <nav class="flex items-center justify-center gap-3 sm:flex-1" [attr.aria-label]="i18n.t('footer.follow')">
      @for (social of socials; track social.icon) {
        <a
          [href]="social.href"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="i18n.t(social.labelKey)"
          [title]="i18n.t(social.labelKey)"
          class="flex h-10 w-10 items-center justify-center rounded-full bg-white/5 text-slate-300 transition duration-300 hover:-translate-y-0.5 hover:bg-royal-600 hover:text-white"
        >
          @switch (social.icon) {
            @case ('instagram') {
              <svg viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <circle cx="12" cy="12" r="4" />
                <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none" />
              </svg>
            }
            @case ('facebook') {
              <svg viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="currentColor" aria-hidden="true">
                <path d="M14 8.5V6.9c0-.7.2-1.1 1.2-1.1H16.5V3.1A17 17 0 0 0 14.6 3c-2 0-3.4 1.2-3.4 3.5v2H9v3h2.2V21h3v-9.5h2.3l.4-3H14Z" />
              </svg>
            }
            @case ('whatsapp') {
              <svg viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="currentColor" aria-hidden="true">
                <path d="M12 2a9.9 9.9 0 0 0-8.5 15L2 22l5.2-1.4A9.9 9.9 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3.1.8.8-3-.2-.3A8 8 0 1 1 12 20Zm4.5-5.9c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.3 0-.5l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4 5.2 5.2 0 0 0 3.2.7 2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3Z" />
              </svg>
            }
          }
        </a>
      }
    </nav>

    <p class="text-center text-xs text-slate-500 sm:flex-1 sm:text-end">
      &copy; {{ year }} {{ i18n.t('brand.full') }} {{ i18n.t('footer.rights') }}
    </p>
  </div>
</footer>
