<!-- Two rows rather than a centred column: the headline stays centred in
     whatever height is left over while the logo strip is anchored to the bottom.
     An `mt-auto` on the strip would not do this — auto margins swallow the free
     space before `justify-center` ever sees it, which drags the headline up to
     the top of the section. -->
<section
  id="top"
  class="hero-bg relative grid min-h-[var(--section-h)] scroll-mt-[var(--header-h)] grid-rows-[1fr_auto] overflow-hidden px-6 py-16 lg:px-10"
  aria-labelledby="hero-heading"
>
  <div class="relative mx-auto flex w-full max-w-7xl items-center">
    <div class="mx-auto max-w-3xl text-center">
      <h1
        id="hero-heading"
        class="hero-title font-display text-4xl font-extrabold leading-[1.1] tracking-tight text-white sm:text-5xl lg:text-6xl"
      >
        {{ i18n.t('hero.title.lead') }}
        <span class="text-royal-400">{{ i18n.t('hero.title.accent') }}</span>
      </h1>

      <p class="hero-sub mx-auto mt-6 max-w-xl text-base leading-relaxed text-slate-300 sm:text-lg">
        {{ i18n.t('hero.subtitle') }}
      </p>
    </div>
  </div>

  @if (showClients) {
    <app-clients class="hero-clients mt-12 lg:mt-16" />
  }
</section>
