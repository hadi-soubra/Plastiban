<section
  id="top"
  class="hero-bg relative flex min-h-[var(--section-h)] scroll-mt-[var(--header-h)] flex-col justify-center overflow-hidden px-6 py-16 lg:px-10"
  aria-labelledby="hero-heading"
>
  <div class="relative mx-auto max-w-7xl">
    <div class="mx-auto max-w-3xl text-center">
      <h1
        id="hero-heading"
        class="hero-title font-display text-4xl font-extrabold leading-[1.1] tracking-tight text-white sm:text-5xl lg:text-6xl"
      >
        {{ i18n.t('hero.title.lead') }}
        <span class="text-royal-400">{{ i18n.t('hero.title.accent') }}</span>
      </h1>

      <p class="hero-sub mx-auto mt-6 max-w-xl text-base leading-relaxed text-slate-300 sm:text-lg">
        {{ i18n.t('hero.subtitle') }}
      </p>
    </div>
  </div>
</section>
