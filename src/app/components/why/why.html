<section
  id="why"
  class="flex min-h-[var(--section-h)] scroll-mt-[var(--header-h)] flex-col justify-center bg-white px-6 py-16 lg:px-10"
  aria-labelledby="why-heading"
>
  <div class="mx-auto w-full max-w-7xl">
    <div class="flex flex-col justify-between gap-6 lg:flex-row lg:items-end">
      <div appReveal>
        <p class="text-xs font-bold uppercase tracking-widest text-royal-600">{{ i18n.t('why.eyebrow') }}</p>
        <h2 id="why-heading" class="mt-3 font-display text-3xl font-extrabold leading-tight text-navy-900 sm:text-4xl">
          {{ i18n.t('why.heading') }}
        </h2>
      </div>
      <p [appReveal]="120" class="max-w-sm text-sm leading-relaxed text-slate-500">{{ i18n.t('why.intro') }}</p>
    </div>

    <div class="mt-12 grid gap-4 sm:gap-6 md:grid-cols-2 lg:grid-cols-3">
      @for (strength of strengths; track strength.titleKey; let i = $index) {
        <div
          [appReveal]="180 + i * 80"
          class="rounded-2xl bg-cream-50 p-6 transition duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-navy-900/10 sm:p-7"
        >
          <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-royal-600/15">
            <span class="h-2.5 w-2.5 rotate-45 bg-royal-600"></span>
          </span>
          <p class="mt-5 font-display text-lg font-bold text-navy-900">{{ i18n.t(strength.titleKey) }}</p>
          <p class="mt-2 text-sm leading-relaxed text-slate-500">{{ i18n.t(strength.descriptionKey) }}</p>
        </div>
      }
    </div>
  </div>
</section>
