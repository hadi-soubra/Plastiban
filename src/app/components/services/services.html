<section
  id="services"
  class="flex min-h-[calc(100dvh-var(--header-h))] scroll-mt-[var(--header-h)] flex-col justify-center bg-navy-900 px-6 py-16 lg:px-10"
>
  <div class="mx-auto w-full max-w-7xl">
    <div class="flex flex-col justify-between gap-6 lg:flex-row lg:items-end">
      <div>
        <p class="text-xs font-bold uppercase tracking-widest text-orange-450">What we do</p>
        <h2 class="mt-3 font-display text-3xl font-extrabold leading-tight text-white sm:text-4xl">
          End to end, under one roof.
        </h2>
      </div>
      <p class="max-w-sm text-sm leading-relaxed text-slate-400">
        From the first sketch to finished product design, manufacturing and technical plastics,
        delivered locally and abroad.
      </p>
    </div>

    <div class="mt-14 grid grid-cols-2 gap-4 sm:gap-6 lg:grid-cols-4">
      @for (service of services; track service.index) {
        <div class="rounded-2xl border border-white/10 p-5 sm:p-7">
          <p class="font-display text-2xl font-extrabold text-orange-450">{{ service.index }}</p>
          <p class="mt-4 font-display text-lg font-bold text-white sm:mt-6">{{ service.title }}</p>
          <p class="mt-3 text-sm leading-relaxed text-slate-400">{{ service.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
