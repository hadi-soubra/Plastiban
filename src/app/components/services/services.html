<section
  id="services"
  class="flex min-h-[var(--section-h)] scroll-mt-[var(--header-h)] flex-col justify-center bg-navy-900 px-6 py-16 lg:px-10"
  aria-labelledby="services-heading"
>
  <div class="mx-auto w-full max-w-7xl">
    <div class="flex flex-col justify-between gap-6 lg:flex-row lg:items-end">
      <div appReveal>
        <p class="text-xs font-bold uppercase tracking-widest text-royal-400">{{ i18n.t('services.eyebrow') }}</p>
        <h2
          id="services-heading"
          class="mt-3 font-display text-3xl font-extrabold leading-tight text-white sm:text-4xl"
        >
          {{ i18n.t('services.heading') }}
        </h2>
      </div>
      <p [appReveal]="120" class="max-w-sm text-sm leading-relaxed text-slate-400">
        {{ i18n.t('services.intro') }}
      </p>
    </div>

    <div class="mt-14 grid grid-cols-2 gap-4 sm:gap-6 lg:grid-cols-4">
      @for (service of services; track service.index; let i = $index) {
        <div
          [appReveal]="180 + i * 110"
          class="group rounded-2xl border border-white/10 p-5 transition duration-300 hover:-translate-y-1 hover:border-royal-400/40 hover:bg-white/[0.03] sm:p-7"
        >
          <p class="inline-block font-display text-2xl font-extrabold text-royal-400 transition-transform duration-300 group-hover:scale-110">
            {{ service.index }}
          </p>
          <p class="mt-4 font-display text-lg font-bold text-white sm:mt-6">{{ i18n.t(service.titleKey) }}</p>
          <p class="mt-3 text-sm leading-relaxed text-slate-400">{{ i18n.t(service.descriptionKey) }}</p>
        </div>
      }
    </div>
  </div>
</section>
